<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Ejercicio 2</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Ejercicio 2: Array de 100 números al azar</h1>
  <p>Declara un array de 100 números y rellénalo con valores al azar. Muéstralo con console.table y filtra los valores de un rango.</p>

  <p>Abre la consola (F12) para ver la salida.</p>
  <input type="number" id="min" placeholder="Mínimo" value="20">
  <input type="number" id="max" placeholder="Máximo" value="40">
  <button id="boton">Filtrar</button>

  <div id="resultado"></div>

  <script src="script.js"></script>
</body>
</html>
